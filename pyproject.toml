[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prime-pattern-agent"
version = "0.1.0"
description = "A pattern-matching research agent for primes and natural measurements, checked against frozen truth tuples."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
nature = ["statsmodels", "scipy", "pooch"]
dev = ["pytest"]

[project.scripts]
ppa = "ppa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
